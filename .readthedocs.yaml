# Read the Docs configuration: builds the documentation site with MkDocs.
# The user guide chapters live in wiki/ (also published as the GitHub wiki);
# scripts/rtd_sync.py copies them into rtd/guide/ before each build, so there
# is one source.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - python scripts/rtd_sync.py

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: rtd/requirements.txt
