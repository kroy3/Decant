site_name: Decant
site_description: Ambient RNA decontamination and contamination-aware differential expression for scRNA-seq and snRNA-seq
repo_url: https://github.com/kroy3/Decant
edit_uri: ""
docs_dir: rtd
theme:
  name: readthedocs
  navigation_depth: 2
extra_css:
  - css/extra.css
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
nav:
